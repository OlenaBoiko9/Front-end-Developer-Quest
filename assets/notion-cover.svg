<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#08090B"/>
    <stop offset=".55" stop-color="#0D0F13"/>
    <stop offset="1" stop-color="#08090B"/>
  </linearGradient>
  <radialGradient id="violet" cx="0" cy="0" r="1" gradientTransform="translate(1260 60) rotate(135) scale(520 330)">
    <stop stop-color="#8D7DFF" stop-opacity=".42"/>
    <stop offset=".6" stop-color="#8D7DFF" stop-opacity=".12"/>
    <stop offset="1" stop-color="#8D7DFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lime" cx="0" cy="0" r="1" gradientTransform="translate(210 470) rotate(-40) scale(480 300)">
    <stop stop-color="#C7FF52" stop-opacity=".22"/>
    <stop offset=".62" stop-color="#C7FF52" stop-opacity=".07"/>
    <stop offset="1" stop-color="#C7FF52" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="title" x1="230" y1="0" x2="1040" y2="0">
    <stop stop-color="#FFFDF8"/>
    <stop offset=".58" stop-color="#B8AEFF"/>
    <stop offset="1" stop-color="#C7FF52"/>
  </linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
</defs>

<rect width="1600" height="500" fill="url(#bg)"/>
<rect width="1600" height="500" fill="url(#grid)"/>
<ellipse cx="1270" cy="80" rx="420" ry="245" fill="url(#violet)" filter="url(#blur)"/>
<ellipse cx="170" cy="480" rx="400" ry="230" fill="url(#lime)" filter="url(#blur)"/>

<g opacity=".9">
  <circle cx="90" cy="72" r="5" fill="#C7FF52"/>
  <text x="110" y="78" fill="#B7BAC1" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="3">OPEN TO WORK</text>
</g>

<text x="90" y="236" fill="url(#title)" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="88" letter-spacing="-5">ARTEM BOYKO</text>
<text x="94" y="286" fill="#8C9098" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="4">DIGITAL DESIGNER  ·  UI/UX  ·  GRAPHIC  ·  WEB</text>

<line x1="94" y1="352" x2="1500" y2="352" stroke="#FFFFFF" stroke-opacity=".10"/>
<text x="94" y="402" fill="#D7D7D4" font-family="Arial, Helvetica, sans-serif" font-size="17">Design that doesn't stop in Figma.</text>
<text x="1490" y="402" text-anchor="end" fill="#7B7E86" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2">PORTFOLIO · 2026</text>

<g transform="translate(1300 196)">
  <rect x="0" y="0" width="200" height="52" rx="26" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".14"/>
  <text x="100" y="33" text-anchor="middle" fill="#FFFDF8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">VIEW SELECTED WORK</text>
</g>
</svg>